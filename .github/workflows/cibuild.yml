name: Build

on:
  push:
    branches-ignore:
      - "dependabot/*"
  pull_request:
  workflow_dispatch:

jobs:
  bsd:
    name: ${{ matrix.platform.name }} ${{ matrix.configuration }} ${{ matrix.platform.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CFLAGS: "-w"
      CXXFLAGS: "-w"
    strategy:
      fail-fast: false
      matrix:
        platform:
        - { name: Haiku,  os: haiku,  os-version: 'r1beta5',  arch: x86_64,
            install-cmd: "sudo pkgman install -y cmake libsdl2 lzo libjpeg_turbo openal libogg libtheora libvorbis",
          }
        configuration: [Debug, Release]

    steps:
    - uses: actions/checkout@main
      with:
        submodules: recursive

    - name: Setup ${{ matrix.platform.name }} and packages
      uses: cross-platform-actions/action@v0.29.0
      with:
        operating_system: ${{ matrix.platform.os }}
        architecture: ${{ matrix.platform.arch }}
        version: ${{ matrix.platform.os-version }}
        cpu_count: 4
        memory: 13G
        environment_variables: CFLAGS CXXFLAGS
        shutdown_vm: false
        sync_files: runner-to-vm
        run: |
          ${{ matrix.platform.install-cmd }}
          cd .. && ls -ar

    - name: Run CMake
      uses: cross-platform-actions/action@v0.29.0
      with:
        operating_system: ${{ matrix.platform.os }}
        architecture: ${{ matrix.platform.arch }}
        version: ${{ matrix.platform.os-version }}
        cpu_count: 4
        memory: 13G
        environment_variables: CFLAGS CXXFLAGS
        shutdown_vm: false
        sync_files: runner-to-vm
        run: |
          ls -ar
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.Configuration }} -DCMAKE_UNITY_BUILD=ON

    - name: Run CMake Build
      uses: cross-platform-actions/action@v0.29.0
      with:
        operating_system: ${{ matrix.platform.os }}
        architecture: ${{ matrix.platform.arch }}
        version: ${{ matrix.platform.os-version }}
        cpu_count: 4
        memory: 13G
        environment_variables: CFLAGS CXXFLAGS
        shutdown_vm: false
        sync_files: false
        run: cmake --build build --config ${{ matrix.Configuration }} --parallel 4
